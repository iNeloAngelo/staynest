name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staynest
          POSTGRES_PASSWORD: staynest
          POSTGRES_DB: staynest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staynest -d staynest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Отдельной dev-базы в CI нет: обе переменные смотрят на тестовую.
      DATABASE_URL: postgres://staynest:staynest@localhost:5432/staynest_test
      DATABASE_URL_TEST: postgres://staynest:staynest@localhost:5432/staynest_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm depcheck
      - run: pnpm knip
      - run: pnpm db:reset:test
      # Дрейф сгенерированных типов Kysely должен ломать CI (ADR-028).
      - run: pnpm db:codegen
      - run: git diff --exit-code -- apps/api/src/platform/db/schema.generated.ts
      - run: pnpm test
      # Down-миграции проверяются на той же тестовой базе (DoD Сессии 2).
      - run: pnpm db:migrate:down --test
      - run: pnpm build

  e2e:
    name: Playwright booking flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staynest
          POSTGRES_PASSWORD: staynest
          POSTGRES_DB: staynest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staynest -d staynest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://staynest:staynest@localhost:5432/staynest_test
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:prepare
      - run: pnpm e2e
      # Production-сборка + Workbox SW: офлайн-чтение и очистка кэшей при выходе.
      - run: pnpm e2e:prepare
      - run: pnpm e2e:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-pwa/
          retention-days: 3

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, dev-CLI kysely-codegen) принят как риск
      # и записан в pnpm-workspace.yaml → auditConfig.ignoreGhsas. См. ADR-030.
      - run: pnpm audit --audit-level high
