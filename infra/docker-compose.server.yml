# Инфраструктура стенда на VPS (staging).
# Прод-контур и укрепление — Сессия 17. Секреты берутся из /opt/staynest/.env (права 600).
name: staynest-server

services:
  postgres:
    # postgres:16-alpine, digest на 2026-10-19
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Только loopback: наружу порт закрыт UFW, доступ с машины разработчика — через SSH-туннель.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  postgres-data:
