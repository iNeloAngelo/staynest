# Staging/prod-контур на VPS. Запуск из корня репозитория:
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
# Секреты и DOMAIN берутся из .env (права 600, в git не попадает).
#
# Сети разделены (Сессия 17):
#   edge     — только Caddy: сюда приходят 80/443 из интернета;
#   internal — API, worker, Postgres, Silo, Mailpit. Наружу не маршрутизируется;
#   ops      — только loopback-публикация Postgres (5433) и Mailpit UI (8025)
#              для SSH-туннеля. Docker не публикует порты контейнеров, которые
#              подключены только к internal-сети, поэтому нужна отдельная bridge-сеть.
# API, Postgres, Silo и Mailpit не имеют публикации портов, кроме loopback.
name: staynest

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: staynest-web:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      S3_BUCKET: ${S3_BUCKET:-staynest-media}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - internal
    depends_on:
      api:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    logging: *logging

  api:
    image: staynest-api:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      # API доступен только через Caddy: доверяем X-Forwarded-For для request.ip.
      TRUST_PROXY: 'true'
      # В staging почта всегда идёт в Mailpit контейнера, а ссылки — на публичный домен.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      APP_WEB_URL: https://${DOMAIN:?DOMAIN is required}
    expose:
      - '3100'
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    logging: *logging

  worker:
    image: staynest-api:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    stop_grace_period: 15s
    env_file: ../.env
    environment:
      NODE_ENV: production
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      APP_WEB_URL: https://${DOMAIN:?DOMAIN is required}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 192m
    logging: *logging

  postgres:
    # postgres:16-alpine, digest на 2026-10-19
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Только loopback для миграций и отладки через SSH-туннель.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
      - ops
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *logging

  silo:
    # pgsty/silo, digest на 2026-10-19 (см. ADR-021)
    image: pgsty/silo@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - silo-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *logging

  mailpit:
    # axllent/mailpit, digest на 2026-10-19
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    environment:
      # Письма нужны только для проверки сценариев на staging.
      MP_MAX_MESSAGES: '500'
    ports:
      # Веб-интерфейс писем только на loopback. Доступ — через SSH-туннель:
      #   ssh -N -L 8025:127.0.0.1:8025 staynest
      - '127.0.0.1:8025:8025'
    networks:
      - internal
      - ops
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8025/livez || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *logging

networks:
  edge:
  internal:
    internal: true
  ops:

volumes:
  postgres-data:
  silo-data:
  caddy-data:
  caddy-config:
