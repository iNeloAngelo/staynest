name: staynest-dev

services:
  postgres:
    # postgres:16-alpine, digest на 2026-10-19
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staynest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staynest}
      POSTGRES_DB: ${POSTGRES_DB:-staynest}
    ports:
      # 5433 на хосте: 5432 часто занят локальным Postgres
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO больше не публикует образы; pgsty/silo — совместимый форк (см. DECISIONS.md)
    image: pgsty/silo@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-staynest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-staynest-minio}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # axllent/mailpit:latest, digest на 2026-10-19
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8025/livez || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
